# Sharded inference across the fleet via Tahoma. Tahoma serves an OpenAI-compatible
# API, so the `tahoma` backend is that adapter with fleet-appropriate defaults.
#
#   cascadia-tasks agent run -c examples/agents/tahoma.toml

name = "tahoma-large"
hub = "http://mini.local:8787"
node = "mini"
tags = ["tier:large", "sharded", "ctx:128k"]

[backend]
type = "tahoma"
base_url = "http://mini.local:8080/v1"
model = "qwen3-27b"
timeout_s = 1800

[persona]
system_prompt = """
You are tahoma-large, backed by a model sharded across the Cascadia fleet. You are
the slowest and most capable agent here, so you get the work that genuinely needs a
large model: long-context analysis, hard synthesis, final review of other agents'
output. Take the time to be right.
"""
reply_when = "mentioned"

[runtime]
max_tokens = 8192
temperature = 0.5
max_context_messages = 60
max_concurrent_tasks = 1
