<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yeschef</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --line: #e3e6ea; --ink: #1b2027;
    --dim: #6b7280; --accent: #2f7d55; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    --online: #2f7d55; --working: #b7791f; --queued: #6b7280; --failed: #c0392b;
    --done: #2f7d55; --cancel: #8a8f98; --input: #6d5bd0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1117; --panel: #161b22; --line: #262c36; --ink: #e6edf3;
      --dim: #8b949e; --accent: #3fb950;
      --online: #3fb950; --working: #d29922; --queued: #8b949e; --failed: #f85149;
      --done: #3fb950; --cancel: #6e7681; --input: #a371f7;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px; line-height: 1.5;
  }
  header {
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    padding: 18px 24px; border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0; font-size: 19px; letter-spacing: -0.01em; }
  header h1 .ball { color: var(--accent); }
  .fleet { color: var(--dim); font-size: 13px; }
  .fleet b { color: var(--ink); }
  .updated { margin-left: auto; color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
  main { padding: 20px 24px; max-width: 1100px; margin: 0 auto; }
  .stats { display: flex; gap: 28px; flex-wrap: wrap; margin-bottom: 8px; }
  .stat .n { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .stat .l { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .caveat { color: var(--dim); font-size: 12px; margin: 4px 0 22px; max-width: 70ch; }
  section { margin-bottom: 26px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim);
       margin: 0 0 8px; font-weight: 600; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  tr:last-child td { border-bottom: none; }
  td.mono, .mono { font-family: var(--mono); font-size: 12.5px; }
  .tabnum { font-variant-numeric: tabular-nums; }
  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px;
          padding: 2px 9px; border-radius: 999px; border: 1px solid transparent; white-space: nowrap; }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .s-online, .s-completed { color: var(--done); background: color-mix(in srgb, var(--done) 12%, transparent); }
  .s-working, .s-claimed { color: var(--working); background: color-mix(in srgb, var(--working) 14%, transparent); }
  .s-queued { color: var(--queued); background: color-mix(in srgb, var(--queued) 14%, transparent); }
  .s-failed { color: var(--failed); background: color-mix(in srgb, var(--failed) 13%, transparent); }
  .s-cancelled { color: var(--cancel); background: color-mix(in srgb, var(--cancel) 14%, transparent); }
  .s-input_required { color: var(--input); background: color-mix(in srgb, var(--input) 14%, transparent); }
  .s-offline { color: var(--dim); background: color-mix(in srgb, var(--dim) 12%, transparent); }
  .bar { height: 4px; background: var(--line); border-radius: 3px; overflow: hidden; min-width: 60px; }
  .bar > i { display: block; height: 100%; background: var(--working); }
  .empty { padding: 26px 14px; text-align: center; color: var(--dim); }
  .empty code { font-family: var(--mono); background: color-mix(in srgb, var(--dim) 14%, transparent);
                padding: 1px 6px; border-radius: 5px; }
  .muted { color: var(--dim); }
  .flag { font-size: 11px; color: var(--failed); font-family: var(--mono); }
  .wrap { overflow-x: auto; }
  .offline-banner { background: color-mix(in srgb, var(--failed) 12%, transparent);
                    border: 1px solid color-mix(in srgb, var(--failed) 30%, transparent);
                    color: var(--failed); border-radius: 10px; padding: 12px 16px; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1><span class="ball">🍳</span> yeschef</h1>
  <span class="fleet" id="fleet">connecting…</span>
  <span class="updated" id="updated"></span>
</header>
<main id="app">
  <div class="empty">loading…</div>
</main>

<script>
const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ago = (s) => {
  if (s == null) return "—";
  if (s < 60) return Math.round(s) + "s";
  if (s < 3600) return Math.round(s/60) + "m";
  return (s/3600).toFixed(1) + "h";
};
const clock = (sec) => sec >= 3600 ? (sec/3600).toFixed(1)+"h" : Math.round(sec/60)+"m";

function statePill(state) {
  return `<span class="pill s-${esc(state)}">${esc(state)}</span>`;
}

function render(d) {
  const online = d.workers.filter(w => w.status === "online").length;
  document.getElementById("fleet").innerHTML =
    `<b>${online}</b>/${d.workers.length} cooks on · <b>${d.lifetime.tasks_completed ?? 0}</b> tickets cooked lifetime`;
  document.getElementById("updated").textContent = "updated " + new Date().toLocaleTimeString();

  const lt = d.lifetime;
  const failTail = (lt.tasks_failed_cancelled ?? 0) > 0
    ? ` <span class="muted">(+${lt.tasks_failed_cancelled} failed/cancelled, ${clock(lt.work_seconds_failed || 0)})</span>` : "";
  const taskTokens = lt.task_tokens ?? lt.local_tokens ?? 0;

  const app = document.getElementById("app");
  app.innerHTML = "";

  if (online === 0) {
    app.appendChild($(`<div class="offline-banner">No cooks are on the line. Clock one in with
      <code style="font-family:var(--mono)">yeschef join</code> on a machine with a local model server.</div>`));
  }

  // lifetime stats
  app.appendChild($(`<div class="stats">
    <div class="stat"><div class="n tabnum">${lt.tasks_completed ?? 0}</div><div class="l">tickets cooked${failTail}</div></div>
    <div class="stat"><div class="n tabnum">${(taskTokens).toLocaleString()}</div><div class="l">tokens cooked locally</div></div>
    <div class="stat"><div class="n tabnum">${clock(lt.work_seconds || 0)}</div><div class="l">local compute</div></div>
  </div>`));
  app.appendChild($(`<p class="caveat">Locally-generated tokens are compute run on your hardware, not saved
    Claude tokens one-for-one — local models are weaker and their output usually needs review.</p>`));

  // cooks
  const wsec = $(`<section><h2>The line</h2></section>`);
  if (!d.workers.length) {
    wsec.appendChild($(`<div class="card"><div class="empty">No cooks clocked in. Run <code>yeschef join</code>.</div></div>`));
  } else {
    const rows = d.workers.map(w => {
      const busy = w.active_tasks ? `<span class="pill s-working">${w.active_tasks} active</span>` : `<span class="muted">idle</span>`;
      const stale = w.status !== "online" ? `<span class="muted"> · ${ago(w.heartbeat_age_s)} ago</span>` : "";
      return `<tr>
        <td class="mono">${esc(w.name)}</td>
        <td class="mono">${esc(w.backend || "—")}</td>
        <td class="mono muted">${esc(w.node || "—")}</td>
        <td>${statePill(w.status)}${stale}</td>
        <td>${busy}</td>
      </tr>`;
    }).join("");
    wsec.appendChild($(`<div class="card wrap"><table>
      <thead><tr><th>cook</th><th>model</th><th>station</th><th>status</th><th>load</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`));
  }
  app.appendChild(wsec);

  // tickets
  const tsec = $(`<section><h2>The rail</h2></section>`);
  if (!d.tasks.length) {
    tsec.appendChild($(`<div class="card"><div class="empty">No tickets yet. Fire one from Claude Code, or <code>yeschef submit</code>.</div></div>`));
  } else {
    const rows = d.tasks.map(t => {
      const live = t.state === "working" || t.state === "claimed";
      const pct = t.progress && t.progress.pct != null ? t.progress.pct : (t.state === "completed" ? 100 : 0);
      const prog = live
        ? `<div class="bar" title="${esc(t.progress?.message || "")}"><i style="width:${pct}%"></i></div>`
        : (t.state === "completed" && t.files ? `<span class="muted">${t.files} file${t.files>1?"s":""}</span>`
           : t.error ? `<span class="flag">${esc(t.error.slice(0,40))}</span>` : `<span class="muted">—</span>`);
      const dur = t.ran_s != null ? ago(t.ran_s) : ago(t.age_s);
      return `<tr>
        <td>${statePill(t.state)}</td>
        <td>${esc(t.title || t.id)}</td>
        <td class="mono muted">${esc(t.assignee || t.selector || "—")}</td>
        <td class="tabnum muted">${dur}</td>
        <td style="min-width:120px">${prog}</td>
      </tr>`;
    }).join("");
    tsec.appendChild($(`<div class="card wrap"><table>
      <thead><tr><th>state</th><th>ticket</th><th>cook</th><th>age</th><th>progress</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`));
  }
  app.appendChild(tsec);

  // rooms
  const active = d.rooms.filter(r => !r.archived);
  if (d.rooms.length) {
    const rsec = $(`<section><h2>Talking it over ${active.length ? `· ${active.length} live` : ""}</h2></section>`);
    const rows = d.rooms.slice(0, 12).map(r => `<tr>
      <td>${esc(r.topic)}</td>
      <td class="mono muted">${esc((r.members || []).join(", ") || "—")}</td>
      <td>${r.archived ? `<span class="pill s-cancelled">${esc(r.archived_reason || "closed")}</span>` : `<span class="pill s-working">open</span>`}</td>
    </tr>`).join("");
    rsec.appendChild($(`<div class="card wrap"><table>
      <thead><tr><th>topic</th><th>participants</th><th>state</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`));
    app.appendChild(rsec);
  }
}

async function tick() {
  try {
    const r = await fetch("/overview", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    render(await r.json());
  } catch (e) {
    document.getElementById("fleet").innerHTML = `<span style="color:var(--failed)">hub unreachable</span>`;
  }
}
tick();
setInterval(tick, 2500);
</script>
</body>
</html>
